# Local rehearsal of the production stack — never used on the server.
# Layers on docker-compose.prod.yml: a throwaway S3 endpoint (rclone serve s3)
# stands in for Cloudflare R2, Caddy uses its internal CA instead of Let's
# Encrypt, and the edge listens on high ports. Run under its own project
# name so nothing touches the dev containers:
#
#   docker compose -p bos-prodcheck -f infra/docker/docker-compose.prod.yml \
#     -f infra/docker/docker-compose.prodcheck.yml --env-file <check.env> up -d --build
#   docker compose -p bos-prodcheck … down -v
services:
  s3:
    image: rclone/rclone:1.71.2
    command: ["serve", "s3", "/data", "--addr", ":9000",
              "--auth-key", "${BACKUP_S3_ACCESS_KEY_ID},${BACKUP_S3_SECRET_ACCESS_KEY}"]
    volumes:
      - s3_data:/data
    deploy: { resources: { limits: { memory: 256m } } }

  postgres:
    depends_on: [s3]

  caddy:
    ports: !override
      - "${CADDY_HTTP_PORT:-18080}:80"
      - "${CADDY_HTTPS_PORT:-18443}:443"

volumes:
  s3_data:
