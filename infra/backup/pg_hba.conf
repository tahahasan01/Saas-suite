# Business OS production pg_hba (infra/backup/Dockerfile).
# Postgres is reachable only on the compose network — no published port —
# and every network login needs a SCRAM password. Replication logins are for
# the `backup` container's weekly pg_basebackup.
# TYPE  DATABASE     USER  ADDRESS   METHOD
local   all          all             trust
local   replication  all             trust
host    all          all   all       scram-sha-256
host    replication  all   all       scram-sha-256
