[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --strict-markers
markers =
    core: platform — auth/sessions, grants, RLS, tokens, billing limits, CSV parsing
    ai: AI gateway and its SQL guard
    crm: leads, scoring, lead CSV
    pos: sales, returns, cash drawer, purchase orders, product CSV
    fbr: FBR digital invoicing — payload, tax split, filing and retry
    hrms: employees, attendance, leave, payroll, employee portal
