# Tool config only: the API is run from source and its dependencies live in
# requirements.txt (runtime) and requirements-dev.txt (lint, types, audit).

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
# Pyflakes + pycodestyle + bugbear + async pitfalls. Rules are spelled out so a
# ruff upgrade that widens its defaults can't turn CI red overnight.
select = ["E", "F", "W", "B", "ASYNC"]
ignore = [
    "E741",  # `l` for a line item reads fine in this codebase's short comprehensions
    "B008",  # FastAPI's `Depends(...)` in defaults is the framework's idiom
    "B905",  # zip(strict=) would change behaviour at call sites that rely on truncation
    "B904",  # HTTPException inside `except` is the intended translation, not a lost cause
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "ASYNC109"]

[tool.mypy]
# The whole package is checked loosely, so existing code type-checks today;
# modules listed under the strict override below must be fully typed. Add every
# NEW module there (Phase 2 rule): strict on new code, ratchet the old.
python_version = "3.12"
files = ["app", "scripts"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "app.activities",
    "app.alerts",
    "app.attendance",
    "app.leads",
    "app.pipelines",
    "app.routers.activities",
    "app.routers.crm_pipelines",
    "app.routers.crm_reports",
    "app.timeline",
    "app.contact_merge",
    "app.contacts",
    "app.contacts_backfill",
    "app.context",
    "app.crypto",
    "app.monitor",
    "app.obs",
    "app.phone",
    "app.pricing",
    "app.routers.contacts",
    "app.routers.meta",
    "app.secheaders",
    "app.startup_guard",
    "app.store",
    "app.worker",
    "scripts.backfill_contacts",
    "scripts.encrypt_credentials",
    "scripts.export_openapi",
    "scripts.seed_staging",
    "scripts.with_db",
    # org data (3A, p3-orgdata)
    "app.branches",
    "app.org_models",
    "app.routers.org",
    "app.routers.sequences",
    "app.sequences",
    "app.files",
    "app.storage",
    "app.routers.files",
    "app.branding",
    "app.tax",
    "app.routers.tax",
    "app.routers.profile",
]
# `strict` itself is global-only in mypy, so its per-module parts are spelled out.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
