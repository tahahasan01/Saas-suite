# Dependency and secret scanning on every PR, and weekly so a new advisory
# against an unchanged lockfile still gets noticed (07 S13).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC (08:17 PKT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (API dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      # Audits what the API image installs (requirements.txt), resolved fresh.
      - run: pip-audit -r services/api/requirements.txt --strict --progress-spinner off

  npm-audit:
    name: npm audit (high and above fails)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Reads package-lock.json only; nothing is installed.
      - run: npm audit --audit-level=high

  gitleaks:
    name: gitleaks (secrets in history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the whole history: a secret removed later is still leaked
      # The CLI in its official container: no licence key needed (the
      # gitleaks-action wrapper requires one for organisation repos).
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
