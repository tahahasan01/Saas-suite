# Build the API and web images on every PR and scan them with Trivy (07 Q5).
# Nothing is pushed here; deploy.yml builds, pushes and deploys on a tag.
name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build + Trivy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Paths agreed with the containers work (2A). The web image builds from
          # the repo root because it needs the npm workspaces (packages/*).
          - name: api
            dockerfile: services/api/Dockerfile
            context: services/api
          - name: web
            dockerfile: apps/web/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile present?
        id: present
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::${{ matrix.dockerfile }} not found yet; skipping the ${{ matrix.name }} image"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.present.outputs.ok == 'true'
      - name: Build
        if: steps.present.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: business-os-${{ matrix.name }}:ci
          build-args: |
            API_ORIGIN=http://api:4000
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy (HIGH/CRITICAL with a fix available fail the build)
        if: steps.present.outputs.ok == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: business-os-${{ matrix.name }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
