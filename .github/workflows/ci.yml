# Every push to main and every PR (07 Q1, Q2, Q6; 14 §3.1 "CI is green").
# Jobs run in parallel; branch protection should require all of them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  workflows:
    name: Workflow hygiene (SHA-pinned actions, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every third-party action is pinned to a commit SHA
        run: bash .github/scripts/check-action-pins.sh
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  backend:
    name: Backend (ruff, mypy, pytest on Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Postgres 16 with pgvector, the same image as infra/docker.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: businessos
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: businessos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U businessos" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://businessos:ci_only_password@localhost:5432/businessos
      # app_user and its password are created by the migrations (see infra/migrations).
      APP_DATABASE_URL: postgres://app_user:app_user_pw@localhost:5432/businessos
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      ENABLE_SCHEDULER: "false"
      EMAIL_PROVIDER: console
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy (strict on new modules, see pyproject.toml)
        run: mypy
      - name: Migrate
        run: python -m scripts.migrate
      - name: Seed terminology
        run: python -m scripts.seed
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider

  contract:
    name: OpenAPI client drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: python -m pip install -r services/api/requirements.txt
      - run: npm ci
      # Importing the app needs no database; the schema is pure code.
      - run: npm run api-client:generate
        env:
          PYTHON: python
      - name: Fail if packages/api-client is stale
        run: |
          if ! git diff --exit-code -- packages/api-client; then
            echo "::error::packages/api-client is out of date. Run 'npm run api-client:generate' and commit the result."
            exit 1
          fi

  web:
    name: Web (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint (jsx-a11y, logical CSS, one Intl entry point)
        run: npm run lint --workspace @business-os/web
      - name: Typecheck (web + packages)
        run: npm run typecheck
      - name: Vitest
        run: npm run test --workspace @business-os/web
      - name: Build
        run: npm run build --workspace @business-os/web
        env:
          # Baked into the /api rewrite at build time (next.config.mjs).
          API_ORIGIN: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: "1"

  e2e-smoke:
    name: Playwright smoke (login -> POS sale)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: businessos
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: businessos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U businessos" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://businessos:ci_only_password@localhost:5432/businessos
      APP_DATABASE_URL: postgres://app_user:app_user_pw@localhost:5432/businessos
      REDIS_URL: redis://localhost:6379
      ENABLE_SCHEDULER: "false"
      EMAIL_PROVIDER: console
      WEB_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: python -m pip install -r services/api/requirements.txt
      - name: Migrate + seed
        working-directory: services/api
        run: |
          python -m scripts.migrate
          python -m scripts.seed
      - name: Start the API
        working-directory: services/api
        env:
          # Plain http in CI, so the session cookie can't be Secure-only.
          NODE_ENV: development
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 4000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://localhost:4000/health && break; sleep 1; done
          curl -fsS http://localhost:4000/health  # fail the step if it never came up
      - run: npm ci
      - name: Build and start the web app
        run: |
          npm run build --workspace @business-os/web
          nohup npm run start --workspace @business-os/web > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/login && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:3000/login
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Smoke + security headers
        working-directory: apps/web
        run: npx playwright test e2e/smoke.spec.ts e2e/security-headers.spec.ts
        env:
          WEB_URL: http://localhost:3000
          API_URL: http://localhost:4000
          E2E_FRESH_TENANT: "1"
      - name: Server logs
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/api.log" || true
          tail -n 200 "$RUNNER_TEMP/web.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
