# Update PRs for pinned actions and dependencies. Actions are pinned to commit
# SHAs (.github/scripts/check-action-pins.sh); Dependabot moves the SHA and the
# version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /services/api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10

  # Base images in the Dockerfiles (from the containers work, 2A) and compose files.
  - package-ecosystem: docker
    directories: [/services/api, /apps/web]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule: { interval: weekly, day: monday }
